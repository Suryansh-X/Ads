<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Vijay Electronics</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    .login-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 60%, #16213e 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative; overflow: hidden;
    }
    .login-bg::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(230,51,18,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 50%, rgba(95,37,159,0.08) 0%, transparent 60%);
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 48px 44px;
      width: 100%; max-width: 460px; position: relative; z-index: 1;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }
    .login-header { text-align: center; margin-bottom: 36px; }
    .login-icon { font-size: 56px; display: block; margin-bottom: 12px; }
    .login-header h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 4px; }
    .login-header p { color: #6b7280; font-size: 14px; }
    .login-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:#e5e7eb; }
    .login-divider span { font-size: 12px; color: #9ca3af; white-space: nowrap; }
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px; color: #9ca3af;
    }
    .login-error {
      background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;
      padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
      margin-bottom: 16px; display: none;
    }
    .login-success {
      background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46;
      padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
      margin-bottom: 16px; display: none;
    }
    .login-loading {
      display: none; text-align: center; color: #9ca3af; font-size: 14px;
    }
    .login-footer { text-align: center; margin-top: 24px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
<div class="login-bg">
  <div class="login-card">

    <div class="login-header">
      <span class="login-icon">🔐</span>
      <h1>Admin Panel</h1>
      <p>Vijay Electronics · Mukerian</p>
    </div>

    <div class="login-error" id="loginError"></div>
    <div class="login-success" id="loginSuccess"></div>
    <div class="login-loading" id="loginLoading">⏳ Verifying credentials...</div>

    <div class="ve-form-group">
      <label>Admin Email</label>
      <input type="email" id="emailInput" class="email-input"
        placeholder="admin@vijayelectronics.in"
        onkeypress="if(event.key==='Enter')doLogin()" autocomplete="email" />
    </div>

    <div class="ve-form-group">
      <label>Admin Password</label>
      <div class="pw-wrap">
        <input type="password" id="pwInput" class="pw-input"
          placeholder="Enter admin password"
          onkeypress="if(event.key==='Enter')doLogin()" autocomplete="current-password" />
        <button class="pw-toggle" type="button" onclick="togglePw()" id="pwToggle">👁️</button>
      </div>
    </div>

    <button class="btn-primary" style="width:100%;justify-content:center;font-size:16px;margin-top:4px" onclick="doLogin()" id="loginBtn">
      🔓 Login to Admin Panel
    </button>

    <div class="login-divider"><span>secure backend authentication</span></div>

    <div style="background:#f8f9fa;border-radius:10px;padding:14px;font-size:13px;color:#6b7280;line-height:1.7">
      🛡️ This panel is for <strong>Vijay Electronics</strong> staff only.<br>
      ✅ Powered by JWT authentication<br>
      Manage products, view orders & generate invoices.
    </div>

    <div class="login-footer">
      <a href="../index.html" style="color:#e63312;text-decoration:none;font-weight:700">← Back to Store</a>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.origin; // Use current domain

  // Redirect if already logged in
  if (localStorage.getItem('adminToken')) {
    verifyTokenAndRedirect();
  }

  function togglePw() {
    const inp = document.getElementById("pwInput");
    const btn = document.getElementById("pwToggle");
    if (inp.type === "password") { inp.type = "text"; btn.textContent = "🙈"; }
    else { inp.type = "password"; btn.textContent = "👁️"; }
  }

  async function doLogin() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("pwInput").value;
    const errorEl = document.getElementById("loginError");
    const successEl = document.getElementById("loginSuccess");
    const loadingEl = document.getElementById("loginLoading");
    const loginBtn = document.getElementById("loginBtn");

    // Validation
    if (!email || !password) {
      showError("Email and password are required");
      return;
    }

    if (!email.includes("@")) {
      showError("Please enter a valid email");
      return;
    }

    try {
      loadingEl.style.display = "block";
      errorEl.style.display = "none";
      successEl.style.display = "none";
      loginBtn.disabled = true;

      // Call backend API
      const response = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Login failed');
      }

      if (data.success && data.token) {
        // Save token to localStorage
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminEmail', email);
        localStorage.setItem('tokenExpiry', Date.now() + (data.expiresIn * 1000));

        showSuccess("✅ Login successful! Redirecting...");
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 1500);
      } else {
        throw new Error('Invalid response from server');
      }

    } catch (err) {
      console.error('Login error:', err);
      showError(`❌ ${err.message}`);
      document.getElementById("pwInput").value = "";
      document.getElementById("pwInput").focus();
    } finally {
      loadingEl.style.display = "none";
      loginBtn.disabled = false;
    }
  }

  function showError(msg) {
    const errorEl = document.getElementById("loginError");
    errorEl.textContent = msg;
    errorEl.style.display = "block";
    setTimeout(() => {
      errorEl.style.display = "none";
    }, 5000);
  }

  function showSuccess(msg) {
    const successEl = document.getElementById("loginSuccess");
    successEl.textContent = msg;
    successEl.style.display = "block";
  }

  async function verifyTokenAndRedirect() {
    try {
      const token = localStorage.getItem('adminToken');
      const response = await fetch(`${API_URL}/api/auth/verify`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (response.ok) {
        window.location.href = "admin.html";
      } else {
        localStorage.removeItem('adminToken');
      }
    } catch (err) {
      console.error('Token verification failed:', err);
      localStorage.removeItem('adminToken');
    }
  }
</script>
</body>
</html>
